[package]
name = "ghpascon-rust"
version = "0.5.0"
edition = "2024"
description = "A personal Rust utility library"
license = "MIT"
repository = "https://github.com/ghpascon/ghpascon-rust"

[dependencies]
regex = "1"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
sha2 = "0.11.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio-serial = "5"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[[example]]
name = "utils_regex"
path = "examples/utils/regex.rs"

[[example]]
name = "example_logger"
path = "examples/utils/logger_manager.rs"

[[example]]
name = "utils_delayed_function"
path = "examples/utils/delayed_function.rs"

[[example]]
name = "example_tag_list"
path = "examples/utils/tag_list.rs"

[[example]]
name = "x714_basic"
path = "examples/devices/rfid/x714/basic.rs"

[[example]]
name = "x714_custom_event"
path = "examples/devices/rfid/x714/custom_event.rs"

[[example]]
name = "x714_from_map"
path = "examples/devices/rfid/x714/from_map.rs"

[[example]]
name = "r700_basic"
path = "examples/devices/rfid/r700/basic.rs"

[[example]]
name = "r700_custom_event"
path = "examples/devices/rfid/r700/custom_event.rs"

[[example]]
name = "device_manager_example"
path = "examples/devices/device_manager_example.rs"
