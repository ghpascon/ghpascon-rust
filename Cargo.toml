[package]
name = "ghpascon-rust"
version = "1.0.0"
edition = "2024"
description = "A personal Rust utility library"
license = "MIT"
repository = "https://github.com/ghpascon/ghpascon-rust"

[dependencies]
regex = "1"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio-serial = "5"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
btleplug = "0.11"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[[example]]
name = "utils_regex"
path = "examples/utils/regex.rs"

[[example]]
name = "example_logger"
path = "examples/utils/logger_manager.rs"

